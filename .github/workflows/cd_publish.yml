name: "📦 CD — Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.repository.fork == false
    name: Release Please
    outputs:
      release_created: ${{ steps.release.outputs['packages/docshelf--release_created'] }}
    steps:
      - name: 🤝 Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          path: packages/docshelf

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: ➕ Actions - Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ➕ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-linux-${{ hashFiles('package.json', 'packages/**/package.json', 'apps/**/package.json') }}
          restore-keys: bun-linux-

      - name: 📦 Installing Dependencies
        run: bun ci

      - name: 🚀 Build Package
        working-directory: packages/docshelf
        run: bun run build

      - name: 📥 Publishing Package
        working-directory: packages/docshelf
        run: npm publish --provenance --access public
