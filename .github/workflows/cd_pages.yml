name: "🌐 CD — GitHub Pages"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Pages site
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v6

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: ➕ Actions - Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ➕ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-linux-${{ hashFiles('package.json', 'packages/**/package.json', 'apps/**/package.json') }}
          restore-keys: bun-linux-

      - name: 📦 Installing Dependencies
        run: bun ci

      - name: 📦 Build package
        run: bun run --filter docshelf build

      - name: 🏗️ Build static docs
        working-directory: apps/docs
        env:
          DOCSHELF_BASE: "/${{ github.event.repository.name }}"
        run: bun run build

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy Pages site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
